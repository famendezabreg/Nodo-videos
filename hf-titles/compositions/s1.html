<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="../assets/gsap.min.js"></script>
    <style>
@font-face{font-family:"Lora";src:url("../assets/fonts/Lora.woff2") format("woff2");font-weight:400 700;font-style:normal}
@font-face{font-family:"Lora";src:url("../assets/fonts/Lora-Italic.woff2") format("woff2");font-weight:400 700;font-style:italic}
@font-face{font-family:"Work Sans";src:url("../assets/fonts/WorkSans.woff2") format("woff2");font-weight:400 600;font-style:normal}
:root{--bg:#1B1815;--text:#F7F2EA;--accent:#EBB593;--eyebrow:#E8C3A4}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
#root{position:relative;width:100%;height:100%;color:var(--text);font-family:"Lora",serif}
.eyebrow{font-family:"Work Sans",sans-serif;font-weight:600;font-size:26px;letter-spacing:.3em;text-transform:uppercase;color:var(--eyebrow);white-space:nowrap}
.small{font-family:"Work Sans",sans-serif;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--eyebrow);font-size:21px;white-space:nowrap}
.h{font-family:"Lora",serif;font-weight:500;color:var(--text);text-shadow:0 2px 28px rgba(27,24,21,.6);letter-spacing:-.01em}
.line{display:block;white-space:nowrap}
.w{display:inline-block;will-change:transform}
.w+.w{margin-left:.26em}
em{font-style:italic;color:var(--accent);font-weight:500}
#blk{position:absolute;left:72px;bottom:380px;width:936px}#rule{width:72px;height:2px;background:var(--accent);margin:24px 0 28px;transform-origin:left}#eb{font-size:24px}</style>
  </head>
  <body>
    <div id="root" data-composition-id="s1" data-start="0" data-duration="3.3333" data-width="1080" data-height="1920" data-fps="30">

      <div id="blk" class="clip" data-start="0" data-duration="3.3333" data-track-index="0">
        <div class="eyebrow" id="eb">Colonia Escalón · San Salvador</div>
        <div id="rule"></div>
        <div class="h" id="g" style="font-size:124px;line-height:1.05"><span class="line"><span class="w" id="g0">Más</span><span class="w" id="g1">que</span><span class="w" id="g2">un</span></span><span class="line"><span class="w" id="g3"><em>espacio.</em></span></span></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#eb", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 0.4167);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, 0.6667);
      tl.fromTo("#g0", { y: 64, opacity: 0 }, { y: 0, opacity: 1, duration: 0.75, ease: "expo.out" }, 0.8333);
      tl.fromTo("#g1", { y: 64, opacity: 0 }, { y: 0, opacity: 1, duration: 0.75, ease: "expo.out" }, 1.0417);
      tl.fromTo("#g2", { y: 64, opacity: 0 }, { y: 0, opacity: 1, duration: 0.75, ease: "expo.out" }, 1.25);
      tl.fromTo("#g3", { y: 64, opacity: 0 }, { y: 0, opacity: 1, duration: 0.75, ease: "expo.out" }, 1.4583);
      tl.to("#blk", { opacity: 0, y: -18, duration: 0.35, ease: "power2.in" }, 2.9167);

      window.__timelines["s1"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
