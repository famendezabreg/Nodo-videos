<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="../assets/gsap.min.js"></script>
    <style>
@font-face{font-family:"Lora";src:url("../assets/fonts/Lora.woff2") format("woff2");font-weight:400 700;font-style:normal}
@font-face{font-family:"Lora";src:url("../assets/fonts/Lora-Italic.woff2") format("woff2");font-weight:400 700;font-style:italic}
@font-face{font-family:"Work Sans";src:url("../assets/fonts/WorkSans.woff2") format("woff2");font-weight:400 600;font-style:normal}
:root{--bg:#1B1815;--text:#F7F2EA;--accent:#EBB593;--eyebrow:#E8C3A4}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
#root{position:relative;width:100%;height:100%;color:var(--text);font-family:"Lora",serif}
.eyebrow{font-family:"Work Sans",sans-serif;font-weight:600;font-size:26px;letter-spacing:.3em;text-transform:uppercase;color:var(--eyebrow);white-space:nowrap}
.small{font-family:"Work Sans",sans-serif;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--eyebrow);font-size:21px;white-space:nowrap}
.h{font-family:"Lora",serif;font-weight:500;color:var(--text);text-shadow:0 2px 28px rgba(27,24,21,.6);letter-spacing:-.01em}
.line{display:block;white-space:nowrap}
.w{display:inline-block;will-change:transform}
.w+.w{margin-left:.26em}
em{font-style:italic;color:var(--accent);font-weight:500}
#p1,#p2{position:absolute;left:72px;bottom:380px;width:936px}</style>
  </head>
  <body>
    <div id="root" data-composition-id="s3" data-start="0" data-duration="3.3333" data-width="1080" data-height="1920" data-fps="30">

      <div id="p1" class="clip" data-start="0" data-duration="3.3333" data-track-index="0"><div class="h" id="a" style="font-size:196px;line-height:1.05"><span class="line"><span class="w" id="a0">Tu</span></span><span class="line"><span class="w" id="a1">puerta.</span></span></div></div>
      <div id="p2" class="clip" data-start="0" data-duration="3.3333" data-track-index="1"><div class="h" id="b" style="font-size:196px;line-height:1.05"><span class="line"><span class="w" id="b0">Tu</span></span><span class="line"><span class="w" id="b1"><em>espacio.</em></span></span></div></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#a0", { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.75, ease: "expo.out" }, 0.8333);
      tl.fromTo("#a1", { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.75, ease: "expo.out" }, 1.0417);
      tl.to("#p1", { opacity: 0, y: -18, duration: 0.2, ease: "power2.in" }, 1.4167);
      tl.fromTo("#b0", { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.75, ease: "expo.out" }, 1.6667);
      tl.fromTo("#b1", { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.75, ease: "expo.out" }, 1.875);
      tl.to("#p2", { opacity: 0, y: -18, duration: 0.35, ease: "power2.in" }, 2.9167);

      window.__timelines["s3"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
